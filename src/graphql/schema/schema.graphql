
enum Priority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
  CLOSED
}

enum UserRole {
  REPORTER
  AGENT
}

enum TicketSortField {
  CREATED_AT
  PRIORITY
}

enum SortOrder {
  ASC
  DESC
}

enum SLAState {
  ON_TRACK
  AT_RISK
  BREACHED
}

type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole!
  createdAt: String!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  createdAt: String!
}

type SLAInfo {
  firstResponseDueAt: String!
  resolutionDueAt: String!
  firstResponseState: SLAState!
  resolutionState: SLAState!
  firstResponseRemainingMinutes: Int!
  resolutionRemainingMinutes: Int!
}

type Ticket {
  id: ID!
  title: String!
  description: String!
  priority: Priority!
  status: TicketStatus!
  reporter: User!
  assignee: User
  comments: [Comment!]!
  createdAt: String!
  firstResponseAt: String
  resolvedAt: String
  sla: SLAInfo!
}

type Holiday {
  id: ID!
  date: String!
  name: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type TicketConnection {
  nodes: [Ticket!]!
  pageInfo: PageInfo!
}

type TicketDashboard {
  openTickets: Int!
  inProgressTickets: Int!
  atRiskTickets: Int!
  breachedTickets: Int!
}

type AuthPayload {
  token: String!
  user: User!
}

type Query {
  tickets(
    status: TicketStatus
    priority: Priority
    assigneeId: ID
    slaState: SLAState
    sortBy: TicketSortField
    sortOrder: SortOrder
    take: Int
    cursor: String
  ): TicketConnection!

  ticket(id: ID!): Ticket
  dashboard: TicketDashboard!
  users(role: UserRole): [User!]!
  holidays: [Holiday!]!
}

type Mutation {
  register(name: String!, email: String!, password: String!, role: UserRole!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!

  createTicket(title: String!, description: String!, priority: Priority!): Ticket!
  assignTicket(ticketId: ID!, assigneeId: ID!): Ticket!
  changeTicketStatus(ticketId: ID!, status: TicketStatus!): Ticket!
  addComment(ticketId: ID!, content: String!): Comment!
  resolveTicket(ticketId: ID!): Ticket!
}
